# ============================================================
# training_config.yaml — Training Schedule
# DTM-RL-GAN: Dynamic Tri-Modal Reinforcement-Learning-Guided Generative Fusion for RGB–Thermal–LiDAR Perception
# ============================================================

seed: 42
device: "cuda"
num_workers: 4
pin_memory: true
use_amp: true

num_epochs: 100
gan_warmup_epochs: 5          # Pure GAN training before RL activates

batch_size: 8
rollout_steps: 2048           # PPO rollout buffer size
ppo_epochs: 10
ppo_minibatch_size: 64

gan_optimizer:
  generator:     { type: adam, lr: 0.0002, betas: [0.5, 0.999], weight_decay: 1.0e-4 }
  discriminator: { type: adam, lr: 0.0001, betas: [0.5, 0.999], weight_decay: 1.0e-4 }

gan_scheduler:
  type: cosine
  T_max: 100
  eta_min: 1.0e-6

ppo_optimizer:
  type: adam
  lr: 3.0e-4
  eps: 1.0e-5

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5

disc_update_freq: 1
gen_update_freq: 1

log_interval: 50
val_interval: 1
save_interval: 5
keep_last_n_ckpts: 3

output_dir:     "outputs/"
checkpoint_dir: "outputs/checkpoints/"
log_dir:        "outputs/logs/"
vis_dir:        "outputs/visualizations/"

early_stopping:
  enabled: true
  patience: 15
  monitor: "val_fusion_quality"
  mode: max

max_grad_norm: 1.0
