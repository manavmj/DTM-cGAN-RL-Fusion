# ============================================================
# data_config.yaml — Dataset Configuration
# DTM-RL-GAN: Dynamic Tri-Modal Reinforcement-Learning-Guided Generative Fusion for RGB–Thermal–LiDAR Perception
# ============================================================

dataset:
  name: "TriModalFusionDataset"
  root: "C:/Users/Student/Desktop/Coding_results"
  train_split: "train"
  val_split: "test"
  test_split: "test"
  file_extension: ".png"
  # Directory layout:
  #   <root>/<split>/rgb/      *.png  — 3-channel colour
  #   <root>/<split>/thermal/  *.png  — 1-channel thermal
  #   <root>/<split>/lidar/    *.png  — 1-channel depth map
  #   <root>/<split>/labels/   *.txt  — YOLO format (optional)

image:
  height: 256
  width: 256
  normalize: true
  rgb_mean:     [0.485, 0.456, 0.406]
  rgb_std:      [0.229, 0.224, 0.225]
  thermal_mean: [0.5]
  thermal_std:  [0.5]
  lidar_mean:   [0.5]
  lidar_std:    [0.5]

augmentation:
  enabled: true
  train_only: true
  random_hflip: 0.5
  random_vflip: 0.0
  random_rotate:  { enabled: true,  degrees: 10 }
  color_jitter:   { enabled: true,  brightness: 0.2, contrast: 0.2,
                    saturation: 0.1, hue: 0.05, apply_to: [rgb] }
  gaussian_noise: { enabled: true,  std: 0.01, apply_to: [thermal, lidar] }

corruption:
  enabled: true
  probability: 0.2
  types: [dropout, noise, blur]
  dropout_prob: 0.1

labels:
  format: yolo
  num_classes: 80
  class_names_file: "data/coco_classes.txt"
